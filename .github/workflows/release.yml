name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and publish GitHub Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode.app"
          xcodebuild -version

      - name: Build (Release, unsigned)
        run: |
          set -e
          xcodebuild \
            -project ProxyMb.xcodeproj \
            -scheme ProxyMb \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
        shell: bash

      - name: Sign, package, and verify extracted app startup
        run: |
          set -euo pipefail
          bash scripts/package_app.sh \
            build/Build/Products/Release/ProxyMb.app \
            dist/ProxyMb-macos.zip \
            "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProxyMb-macos.zip
          generate_release_notes: true
          body: |
            This build is ad-hoc signed, not Developer ID signed or notarized.
            macOS may require explicit approval in Privacy & Security when opening a downloaded app.
            Signature integrity, release version, and isolated startup of the extracted ZIP are checked before publication.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
