name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        shell: bash
        run: |
          sudo xcode-select -s "/Applications/Xcode.app"
          xcodebuild -version

      - name: Run isolated core regression tests
        run: swift test

      - name: Build and test app (Debug, unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProxyMb.xcodeproj \
            -scheme ProxyMb \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:ProxyMbTests \
            build test

      - name: Build and test release packaging
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProxyMb.xcodeproj \
            -scheme ProxyMb \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
          bash scripts/test_package_app.sh build/Build/Products/Release/ProxyMb.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release/ProxyMb.app/Contents/Info.plist)
          bash scripts/package_app.sh build/Build/Products/Release/ProxyMb.app dist/ProxyMb-macos.zip "$VERSION"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            dist/ProxyMb-macos.zip
          if-no-files-found: ignore
          retention-days: 7
